<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friday · {% block title %}비브레이브{% endblock %}</title>
<style>
  :root {
    --ink: #12151a; --ink-soft: #6b7280; --ink-muted: #9aa1ab; --paper: #eef0f3; --panel: #ffffff;
    --line: #e3e5e9; --accent: #12151a; --accent-soft: #e4e6ea;
    --ok: #3f7d3f; --ok-bg: #e4f3e9; --err: #c22a1a; --err-bg: #fbe6e2; --warn: #b0791a; --warn-bg: #f7ecd8;
    --money: #1d5fd6; --money-bg: #e6edfc; --money-2: #6a97ea;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: -apple-system, "system-ui", "Segoe UI", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --sidebar-w: 190px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  a { color: var(--accent); }

  .layout { display: flex; min-height: 100vh; }

  nav.sidebar {
    width: var(--sidebar-w); flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--line); padding: 18px 12px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  nav.sidebar .brand { font-weight: 700; font-size: 16px; padding: 0 10px 16px; }
  nav.sidebar .nav-group {
    font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-muted);
    font-weight: 700; margin: 20px 10px 6px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  nav.sidebar .nav-group:first-of-type { border-top: none; padding-top: 0; }
  nav.sidebar .nav-links { display: flex; flex-direction: column; gap: 2px; }
  nav.sidebar a {
    display: block; text-decoration: none; color: var(--ink-soft); font-size: 13.5px;
    padding: 9px 10px; border-radius: 6px;
    transition: background .12s ease, color .12s ease;
  }
  nav.sidebar a:hover, nav.sidebar a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .shell { flex: 1; min-width: 0; max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; }

  .flash { padding: 11px 14px; border-radius: 6px; font-size: 13.5px; margin-bottom: 16px; line-height: 1.5; }
  .flash-success { background: var(--ok-bg); color: var(--ok); }
  .flash-error { background: var(--err-bg); color: var(--err); }

  h1 { font-size: 20px; font-weight: 700; margin: 4px 0 18px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; }

  .eyebrow { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); font-weight: 600; margin: 0 0 8px; }
  .section { margin-bottom: 26px; }

  .todo-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 16px; margin-bottom: 8px; text-decoration: none; color: inherit;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .todo-row:last-child { margin-bottom: 0; }
  a.todo-row:hover { transform: translateX(2px); border-color: var(--accent); box-shadow: 0 3px 10px rgba(18,21,26,0.06); }
  .todo-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .todo-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-err { background: var(--err); }
  .dot-ok { background: var(--ok); }
  .dot-idle { background: var(--ink-muted); }
  .todo-title { font-size: 14px; font-weight: 700; margin: 0; }
  .todo-title.attn { color: var(--err); }
  .todo-sub { font-size: 12px; color: var(--ink-muted); margin: 2px 0 0; }
  .todo-arrow { color: var(--ink-muted); font-size: 16px; flex-shrink: 0; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
  .stat-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
    text-decoration: none; color: inherit; display: block;
    box-shadow: 0 1px 2px rgba(18,21,26,0.04);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .stat-card.link:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 6px 16px rgba(18,21,26,0.08); }
  .stat-icon {
    width: 26px; height: 26px; border-radius: 7px; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; margin-bottom: 8px; font-size: 14px;
  }
  .stat-icon.money { background: var(--money-bg); color: var(--money); }
  .stat-num { font-size: 21px; font-weight: 700; margin: 0; }
  .stat-num.money { color: var(--money); }
  .stat-num.attn { color: var(--err); }
  .stat-label { font-size: 12px; color: var(--ink-muted); margin: 2px 0 0; }

  .badge-ok { display: inline-block; font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 99px; background: var(--ok-bg); color: var(--ok); }
  .badge-err { display: inline-block; font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 99px; background: var(--err-bg); color: var(--err); font-weight: 600; }
  .score-badge { display: inline-block; font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 99px; margin-right: 4px; }
  .score-high { background: var(--ok-bg); color: var(--ok); }
  .score-mid { background: var(--money-bg); color: var(--money); }
  .score-low { background: var(--warn-bg); color: var(--warn); }

  .chart-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; flex-wrap: wrap; gap: 10px; }
  .month-nav { display: flex; align-items: center; gap: 10px; }
  .month-nav button { background: none; border: 1px solid var(--line); border-radius: 6px; width: 28px; height: 28px; padding: 0; font-size: 13px; color: var(--ink-soft); cursor: pointer; }
  .month-nav button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .month-nav button:disabled { opacity: 0.35; cursor: default; }
  .month-nav .month-label { font-size: 14px; font-weight: 700; min-width: 90px; text-align: center; }
  .chart-legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend .sw { width: 14px; height: 0; border-top: 2px solid; display: inline-block; }
  .legend-toggle { cursor: pointer; padding: 3px 8px; border-radius: 99px; transition: background .12s ease; user-select: none; }
  .legend-toggle:hover { background: var(--accent-soft); }
  .legend-toggle.off { opacity: 0.4; }
  .legend-toggle.off .sw { border-color: var(--ink-muted) !important; border-top-style: solid !important; }
  .chart-wrap { position: relative; }
  .chart-tooltip {
    position: absolute; background: var(--ink); color: #fff; font-size: 12px; padding: 6px 10px;
    border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity .1s ease; white-space: nowrap; z-index: 2;
    transform: translate(-50%, -100%);
  }
  .chart-tooltip .tt-date { color: var(--ink-muted); font-size: 11px; margin-bottom: 2px; }

  .stack-bar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--line); }
  .stack-seg-ok { background: var(--ok); }
  .stack-seg-warn { background: var(--warn); }
  .stack-seg-err { background: var(--err); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--ink-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; }

  label { display: block; font-size: 12.5px; color: var(--ink-soft); margin: 10px 0 4px; }
  input[type=text], input[type=number], input[type=password], select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: var(--panel); color: var(--ink);
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  input[type=text]:focus, input[type=number]:focus, input[type=password]:focus, select:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input[type=checkbox] { margin-right: 6px; }

  button, .btn {
    background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: 10px;
    padding: 11px 18px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
    display: inline-block; text-decoration: none;
    transition: background .12s ease, transform .08s ease;
  }
  button:hover, .btn:hover { background: #2a2d33; }
  button:active, .btn:active { background: #3f3f46; transform: scale(0.98); }
  button.secondary, .btn.secondary { background: var(--panel); color: var(--ink-soft); border-color: var(--line); }
  button.secondary:hover, .btn.secondary:hover { background: var(--accent-soft); }
  button.danger { background: var(--err); border-color: var(--err); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  tbody tr { transition: background .1s ease; }
  tbody tr:hover { background: var(--paper); }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--ink-soft); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--ink-soft); }
  .badge { display: inline-block; font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }

  .table-wrap { overflow-x: auto; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  @media (max-width: 680px) {
    .layout { flex-direction: column; }
    nav.sidebar {
      width: 100%; height: auto; position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 2px; overflow-x: auto;
      padding: 10px 12px; border-right: none; border-bottom: 1px solid var(--line);
    }
    nav.sidebar .brand { padding: 0 10px 0 0; margin-bottom: 0; white-space: nowrap; }
    nav.sidebar a { white-space: nowrap; margin-bottom: 0; }
    .shell { padding: 18px 14px 50px; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="brand">Friday</div>
    <div class="nav-links">
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">홈</a>
    </div>
    <p class="nav-group">상품</p>
    <div class="nav-links">
      <a href="{{ url_for('candidates') }}" class="{{ 'active' if request.endpoint in ('candidates','candidates_preview') }}">발굴 후보</a>
      <a href="{{ url_for('registered') }}" class="{{ 'active' if request.endpoint == 'registered' }}">등록 상품</a>
      <a href="{{ url_for('tracker') }}" class="{{ 'active' if request.endpoint == 'tracker' }}">판매추적</a>
    </div>
    <p class="nav-group">주문</p>
    <div class="nav-links">
      <a href="{{ url_for('orders') }}" class="{{ 'active' if request.endpoint in ('orders','orders_check','orders_demo') }}">주문 확인</a>
      <a href="{{ url_for('purchase') }}" class="{{ 'active' if request.endpoint == 'purchase' }}">도매매 발주</a>
    </div>
    <p class="nav-group">부가기능</p>
    <div class="nav-links">
      <a href="{{ url_for('report') }}" class="{{ 'active' if request.endpoint == 'report' }}">주간리포트</a>
      <a href="{{ url_for('margin') }}" class="{{ 'active' if request.endpoint == 'margin' }}">마진계산</a>
    </div>
  </nav>
  <div class="shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="flash flash-{{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</div>
</body>
</html>
