<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friday · {% block title %}비브레이브{% endblock %}</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root {
    /* 잉크 — 블루 바이올렛 톤이 도는 다크 뉴트럴 (순검정 대신) */
    --ink: #1a1523; --ink-soft: #6e6478; --ink-muted: #a79fb3;
    --paper: #f2f5fb; --panel: #ffffff; --line: #e9e4f5;
    /* 블루 = "지금 처리할 것" 액션 컬러 / 바이올렛 = "값" · 정보 컬러 — 의도적으로 분리 */
    --accent: #3b6ff6; --accent-soft: #e3ecff;
    --violet: #7c5cfc; --violet-soft: #ece6ff;
    --chip-bg: #efebfa; --chip-ink: #5b5270;
    --row-hover: rgba(124,92,252,0.05);
    --ok: #17976b; --ok-bg: #e1f7ec;
    --err: #e0393f; --err-bg: #fdeaea;
    --warn: #d97706; --warn-bg: #fdf1de;
    --money: #7c5cfc; --money-bg: #ece6ff; --money-2: #3b6ff6;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: "Pretendard Variable", "Pretendard", -apple-system, "system-ui", "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --sidebar-w: 200px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  a { color: var(--accent); }
  ::selection { background: var(--accent-soft); color: var(--ink); }

  .layout { display: flex; min-height: 100vh; }

  nav.sidebar {
    /* LNB만 별도 다크 팔레트 — 나머지 화면은 라이트 유지. 여기서 지역적으로
       덮어쓴 변수들을 하위 규칙(브랜드/그룹라벨/링크)이 그대로 참조한다. */
    --panel: #14101c; --line: #2a2338; --ink: #ffffff; --ink-soft: #ffffff; --ink-muted: rgba(255,255,255,0.55);
    --accent-soft: rgba(59,111,246,0.28); --accent: #ffffff;
    width: var(--sidebar-w); flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--line); padding: 20px 14px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  nav.sidebar .brand {
    display: flex; align-items: center; gap: 8px; color: var(--ink);
    font-weight: 800; font-size: 16.5px; letter-spacing: -0.01em; padding: 2px 10px 18px;
  }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--violet));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; box-shadow: 0 3px 8px rgba(124,92,252,0.35);
  }
  nav.sidebar .nav-group {
    font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-muted);
    font-weight: 700; margin: 20px 10px 6px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  nav.sidebar .nav-group:first-of-type { border-top: none; padding-top: 0; }
  nav.sidebar .nav-links { display: flex; flex-direction: column; gap: 2px; }
  nav.sidebar a {
    display: block; text-decoration: none; color: var(--ink-soft); font-size: 13.5px;
    padding: 9px 10px; border-radius: 10px;
    transition: background .12s ease, color .12s ease;
  }
  nav.sidebar a:hover, nav.sidebar a.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }

  .shell { flex: 1; min-width: 0; padding: 24px 40px 60px; }

  .flash { padding: 11px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 16px; line-height: 1.5; }
  .flash-success { background: var(--ok-bg); color: var(--ok); }
  .flash-error { background: var(--err-bg); color: var(--err); }

  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin: 4px 0 18px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(26,21,35,0.04);
  }
  .panel h2 { font-size: 14px; margin: 0 0 12px; }

  .eyebrow { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); font-weight: 600; margin: 0 0 8px; }
  .section { margin-bottom: 26px; }

  .todo-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 16px; margin-bottom: 8px; text-decoration: none; color: inherit;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .todo-row:last-child { margin-bottom: 0; }
  a.todo-row:hover { transform: translate(2px,-1px); border-color: var(--accent); box-shadow: 0 8px 18px rgba(59,111,246,0.14); }
  .todo-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .todo-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-err { background: var(--err); }
  .dot-ok { background: var(--ok); }
  .dot-idle { background: var(--ink-muted); }
  .todo-title { font-size: 14px; font-weight: 700; margin: 0; }
  .todo-title.attn { color: var(--err); }
  .todo-sub { font-size: 12px; color: var(--ink-muted); margin: 2px 0 0; }
  .todo-arrow { color: var(--ink-muted); font-size: 16px; flex-shrink: 0; }
  .todo-cols { display: flex; }
  .todo-col { flex: 1; padding: 0 20px; min-width: 0; }
  .todo-col:first-child { padding-left: 0; }
  .todo-col:not(:first-child) { border-left: 1px solid var(--line); }
  .todo-col-title {
    display: flex; align-items: center; gap: 6px;
    font-size: 15px; font-weight: 500; color: var(--ink); margin: 0 0 10px;
  }
  .todo-col-title svg { flex-shrink: 0; }
  .todo-line {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 7px 0; text-decoration: none; color: inherit; font-size: 13px;
    border-bottom: 1px solid var(--line);
  }
  .todo-line:last-child { border-bottom: none; }
  .todo-line:hover span:first-child { color: var(--accent); }
  .todo-line b { color: var(--err); font-weight: 700; flex-shrink: 0; }
  /* 조회 실패 — 0건과 반드시 구분돼야 한다. 갈 곳이 없으므로 링크가 아니다. */
  .todo-line.unknown { color: var(--ink-soft); cursor: default; }
  .todo-line.unknown b { color: var(--warn); }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
  .stat-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px;
    text-decoration: none; color: inherit; display: block;
    box-shadow: 0 1px 3px rgba(26,21,35,0.05);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .stat-card.link:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 10px 22px rgba(59,111,246,0.16); }
  .stat-icon {
    width: 28px; height: 28px; border-radius: 9px; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; margin-bottom: 8px; font-size: 14px;
  }
  .stat-icon.money { background: var(--money-bg); color: var(--money); }
  .stat-num { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; margin: 0; font-variant-numeric: tabular-nums; }
  .stat-num.money { color: var(--money); }
  .stat-num.attn { color: var(--err); }
  .stat-label { font-size: 12px; color: var(--ink-muted); margin: 3px 0 0; }

  .badge-ok { display: inline-block; font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 99px; background: var(--ok-bg); color: var(--ok); }
  .badge-err { display: inline-block; font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 99px; background: var(--err-bg); color: var(--err); font-weight: 600; }
  .badge-warn { display: inline-block; font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); font-weight: 600; }

  /* 컬럼 헤더 등에 붙는 "?" 아이콘 — 누르면 기준 설명이 뜬다(클릭식, 호버 아님) */
  .tip-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; border-radius: 50%; background: var(--chip-bg);
    color: var(--chip-ink); font-size: 10px; font-weight: 700; border: none; cursor: pointer;
    margin-left: 4px; vertical-align: middle; padding: 0; position: relative;
  }
  .tip-btn:hover { background: var(--violet-soft); color: var(--violet); }
  .tip-bubble {
    display: none; position: absolute; left: 0; top: 130%;
    background: var(--ink); color: #fff; font-size: 11.5px; font-weight: 400;
    text-transform: none; letter-spacing: normal; text-align: left;
    padding: 10px 12px; border-radius: 10px; white-space: normal; width: 290px;
    line-height: 1.5; z-index: 20; box-shadow: 0 10px 26px rgba(26,21,35,0.24);
  }
  .tip-btn.open .tip-bubble { display: block; }
  .tip-bubble p { margin: 0 0 6px; }
  .tip-bubble ul { margin: 0; padding-left: 16px; }
  .tip-bubble li { margin-bottom: 4px; }
  .tip-bubble li:last-child { margin-bottom: 0; }
  .tip-bubble b { color: #fff; }

  /* 상세 미리보기용 모달 */
  dialog#modal {
    border: none; border-radius: 20px; padding: 0; width: min(1020px, 92vw);
    max-height: 86vh; box-shadow: 0 24px 70px rgba(26,21,35,0.28);
    transition: width .15s ease;
  }
  dialog#modal.modal-wide { width: min(1480px, 96vw); }
  .detail-layout { display: flex; gap: 20px; align-items: flex-start; }
  .detail-main { flex: 1 1 auto; min-width: 0; }
  .field-audit-panel { flex: 0 0 420px; max-width: 420px; }
  .field-audit-group { margin-bottom: 14px; }
  .field-audit-group h4 { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 6px; }
  .field-audit-row {
    display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
    padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12.5px;
  }
  .field-audit-row .fa-label { color: var(--ink-soft); flex: 0 0 130px; }
  .field-audit-row .fa-value { flex: 1 1 auto; text-align: right; word-break: break-all; }
  .field-audit-row .fa-note { display: block; font-size: 11px; color: var(--warn); text-align: right; margin-top: 2px; }
  dialog#modal::backdrop { background: rgba(26,21,35,0.45); backdrop-filter: blur(2px); }
  .modal-head {
    position: sticky; top: 0; display: flex; justify-content: flex-end;
    padding: 10px 12px 0; background: var(--panel);
  }
  .modal-close {
    background: none; border: none; color: var(--ink-soft); font-size: 20px;
    cursor: pointer; padding: 4px 8px; line-height: 1; border-radius: 8px;
    transition: background .12s ease, color .12s ease;
  }
  .modal-close:hover { color: var(--ink); background: var(--chip-bg); }
  .modal-body { padding: 0 22px 22px; overflow-y: auto; }
  .modal-loading { padding: 40px 0; text-align: center; color: var(--ink-muted); font-size: 13px; }
  .score-badge { display: inline-block; font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 99px; margin-right: 4px; }
  .score-high { background: var(--ok-bg); color: var(--ok); }
  .score-mid { background: var(--money-bg); color: var(--money); }
  .score-low { background: var(--warn-bg); color: var(--warn); }

  .chart-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; flex-wrap: wrap; gap: 10px; }
  .month-nav { display: flex; align-items: center; gap: 10px; }
  .month-nav button { background: none; border: 1px solid var(--line); border-radius: 8px; width: 28px; height: 28px; padding: 0; font-size: 13px; color: var(--ink-soft); cursor: pointer; }
  .month-nav button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .month-nav button:disabled { opacity: 0.35; cursor: default; }
  .month-nav .month-label { font-size: 14px; font-weight: 700; min-width: 90px; text-align: center; }
  .chart-legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend .sw { width: 14px; height: 0; border-top: 2px solid; display: inline-block; }
  .legend-toggle { cursor: pointer; padding: 3px 8px; border-radius: 99px; transition: background .12s ease; user-select: none; }
  .legend-toggle:hover { background: var(--chip-bg); }
  .legend-toggle.off { opacity: 0.4; }
  .legend-toggle.off .sw { border-color: var(--ink-muted) !important; border-top-style: solid !important; }
  .chart-wrap { position: relative; }
  .chart-tooltip {
    position: absolute; background: var(--ink); color: #fff; font-size: 12px; padding: 6px 10px;
    border-radius: 8px; pointer-events: none; opacity: 0; transition: opacity .1s ease; white-space: nowrap; z-index: 2;
    transform: translate(-50%, -100%);
  }
  .chart-tooltip .tt-date { color: var(--ink-muted); font-size: 11px; margin-bottom: 2px; }

  .stack-bar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--line); }
  .stack-seg-ok { background: var(--ok); }
  .stack-seg-warn { background: var(--warn); }
  .stack-seg-err { background: var(--err); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--ink-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; }

  label { display: block; font-size: 12.5px; color: var(--ink-soft); margin: 10px 0 4px; }
  input[type=text], input[type=number], input[type=password], select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; font-family: inherit; background: var(--panel); color: var(--ink);
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  input[type=text]:focus, input[type=number]:focus, input[type=password]:focus, select:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input[type=checkbox] { margin-right: 6px; }

  button, .btn {
    background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: 999px;
    padding: 11px 20px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
    display: inline-block; text-decoration: none;
    transition: background .12s ease, transform .1s ease, box-shadow .12s ease;
  }
  button:hover, .btn:hover { background: #2f5fe0; transform: translateY(-1px); box-shadow: 0 8px 18px rgba(59,111,246,0.28); }
  button:active, .btn:active { background: #2450c7; transform: scale(0.98); box-shadow: none; }
  button.secondary, .btn.secondary { background: var(--panel); color: var(--ink-soft); border-color: var(--line); box-shadow: none; }
  button.secondary:hover, .btn.secondary:hover { background: var(--chip-bg); color: var(--ink); transform: none; box-shadow: none; }
  button.danger { background: var(--err); border-color: var(--err); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  tbody tr { transition: background .1s ease; }
  tbody tr:hover { background: var(--row-hover); }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--ink-soft); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--ink-soft); }
  .badge { display: inline-block; font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 99px; background: var(--chip-bg); color: var(--chip-ink); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: -4px 0 20px; }
  .tabs a {
    text-decoration: none; color: var(--ink-soft); font-size: 13.5px; font-weight: 600;
    padding: 10px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tabs a:hover { color: var(--ink); }
  .tabs a.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs .tab-count { font-family: var(--mono); font-size: 10.5px; background: var(--chip-bg); color: var(--chip-ink); border-radius: 99px; padding: 1px 7px; }
  .tabs a.active .tab-count { background: var(--accent-soft); color: var(--accent); }

  .table-wrap { overflow-x: auto; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .btn-sm, button.btn-sm { padding: 5px 10px; font-size: 12px; }
  .hint { font-size: 11.5px; color: var(--ink-soft); line-height: 1.45; margin: 3px 0 0; }
  .page-note { color: var(--ink-soft); font-size: 13px; margin: -10px 0 16px; }
  .actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  td.num, th.num { text-align: right; white-space: nowrap; min-width: 96px; font-family: var(--mono); }
  button:disabled, .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }

  /* 목록 화면 공통 — 검색·필터가 한 줄, 행을 고르면 그 아래 일괄 액션 바가 나타난다. */
  .filterbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: -6px 0 14px; }
  .filterbar input[type=text], .filterbar select { margin: 0; max-width: 220px; }
  .filterbar .spacer { flex: 1; }
  .bulkbar {
    position: sticky; top: 0; z-index: 4; margin-bottom: 14px;
    background: var(--accent-soft); border: 1px solid var(--accent);
    border-radius: 12px; padding: 10px 14px;
  }
  /* hidden 속성은 어떤 display 스타일보다 우선한다 — button/.btn 등의 display가 덮어써서 숨겨야 할 요소가
     보였다(AI 버전 모달의 "결과 보고 편집하기"가 실패해도 보임, 세부 카테고리가 안 접힘, 2026-09) */
  [hidden] { display: none !important; }
  .bulkbar[hidden] { display: none; }
  .bulkbar .sel-count { font-weight: 700; color: var(--accent); font-size: 13px; white-space: nowrap; }
  .bulkbar .group-label { font-size: 11px; color: var(--ink-soft); align-self: center; }
  .bulkbar .divider { width: 1px; height: 20px; background: var(--line); }
  .delta-up { color: var(--ok); }
  .delta-down { color: var(--err); }

  @media (max-width: 680px) {
    .layout { flex-direction: column; }
    nav.sidebar {
      width: 100%; height: auto; position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 2px; overflow-x: auto;
      padding: 10px 12px; border-right: none; border-bottom: 1px solid var(--line);
    }
    nav.sidebar .brand { padding: 0 10px 0 0; margin-bottom: 0; white-space: nowrap; }
    nav.sidebar a { white-space: nowrap; margin-bottom: 0; }
    .shell { padding: 18px 14px 50px; }
  }

  /* ── 모션 ─────────────────────────────────────────────
     원칙: 움직임은 "무엇이 바뀌었는지" 알려줄 때만 쓴다. 들어올 땐 빠르게 출발해 부드럽게
     멈추고(ease-out), 나갈 땐 더 짧게. 이동 거리는 8px 안쪽, 크기 변화는 3% 안쪽 —
     화려함보다 정돈감. 시간·곡선은 아래 토큰만 쓴다. */
  :root {
    --ease-out: cubic-bezier(.16,1,.3,1);
    --ease-in: cubic-bezier(.4,0,1,1);
    --ease-spring: cubic-bezier(.34,1.45,.64,1);
    --d-fast: 140ms; --d-base: 220ms; --d-slow: 420ms;
  }

  /* 1) 화면 전환 — LNB는 그대로 두고 본문만 교차. 선택된 메뉴·탭 표시는 이전 위치에서 새 위치로 미끄러진다. */
  @media (prefers-reduced-motion: no-preference) {
    @view-transition { navigation: auto; }
  }
  nav.sidebar { view-transition-name: lnb; }
  nav.sidebar a.active { view-transition-name: lnb-active; }
  .tabs a.active { view-transition-name: tab-active; }
  ::view-transition-group(lnb-active), ::view-transition-group(tab-active) {
    animation-duration: var(--d-slow); animation-timing-function: var(--ease-out);
  }
  ::view-transition-old(root) { animation: fade-out var(--d-fast) var(--ease-in) both; }
  ::view-transition-new(root) { animation: fade-in var(--d-base) var(--ease-out) both; }
  @keyframes fade-out { to { opacity: 0; } }
  @keyframes fade-in { from { opacity: 0; } }

  /* 2) 본문 등장 — 블록이 위에서부터 40ms 간격으로 살짝 떠오른다. backwards라 끝나면 흔적(transform)이 안 남는다. */
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .shell > :not(style):not(script) { animation: rise var(--d-slow) var(--ease-out) backwards; }
  .shell > :nth-child(2) { animation-delay: 40ms; }
  .shell > :nth-child(3) { animation-delay: 80ms; }
  .shell > :nth-child(4) { animation-delay: 120ms; }
  .shell > :nth-child(5) { animation-delay: 160ms; }
  .shell > :nth-child(6) { animation-delay: 200ms; }
  .shell > :nth-child(n+7) { animation-delay: 240ms; }

  /* 3) 손에 닿는 것들 — 메뉴는 살짝 밀리고, 버튼은 눌리면 즉시 줄었다가 놓으면 부드럽게 돌아온다. */
  nav.sidebar a { transition: background var(--d-fast) ease, color var(--d-fast) ease, transform var(--d-base) var(--ease-out); }
  nav.sidebar a:hover:not(.active) { transform: translateX(3px); }
  .brand-mark { transition: transform var(--d-slow) var(--ease-spring), box-shadow var(--d-base) ease; }
  .brand:hover .brand-mark { transform: rotate(-8deg) scale(1.06); box-shadow: 0 6px 14px rgba(124,92,252,0.45); }
  button, .btn {
    transition: background var(--d-fast) ease, color var(--d-fast) ease, transform var(--d-base) var(--ease-out),
      box-shadow var(--d-base) var(--ease-out), opacity var(--d-fast) ease;
  }
  button:active, .btn:active { transform: scale(0.97); transition-duration: 60ms; }
  .todo-row, .stat-card { transition-duration: var(--d-base); transition-timing-function: var(--ease-out); }
  .todo-line span:first-child, .tabs a { transition: color var(--d-fast) ease; }

  /* 4) 모달 — 배경이 먼저 흐려지고, 창은 아래에서 살짝 올라오며 커진다. 닫힐 땐 더 빠르게. */
  dialog#modal {
    opacity: 0; transform: translateY(12px) scale(0.985);
    transition: opacity var(--d-base) var(--ease-out), transform var(--d-slow) var(--ease-out),
      width var(--d-slow) var(--ease-out), overlay var(--d-base) allow-discrete, display var(--d-base) allow-discrete;
  }
  dialog#modal[open] { opacity: 1; transform: none; }
  @starting-style { dialog#modal[open] { opacity: 0; transform: translateY(12px) scale(0.985); } }
  dialog#modal:not([open]) { transition-duration: var(--d-fast); transition-timing-function: var(--ease-in); }
  dialog#modal::backdrop {
    background: rgba(26,21,35,0); backdrop-filter: blur(0);
    transition: background var(--d-base) ease, backdrop-filter var(--d-base) ease,
      overlay var(--d-base) allow-discrete, display var(--d-base) allow-discrete;
  }
  dialog#modal[open]::backdrop { background: rgba(26,21,35,0.45); backdrop-filter: blur(3px); }
  @starting-style { dialog#modal[open]::backdrop { background: rgba(26,21,35,0); backdrop-filter: blur(0); } }
  /* 불러오는 중 — 글자 위로 빛이 지나간다(빙글빙글 도는 스피너보다 차분함) */
  .modal-loading {
    background: linear-gradient(90deg, var(--ink-muted) 40%, var(--ink) 50%, var(--ink-muted) 60%) 0 0 / 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 1.6s linear infinite;
  }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }

  /* 5) 나타나는 조각들 — 도움말 말풍선, 일괄 액션 바 */
  @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(0.97); } }
  .tip-btn.open .tip-bubble { animation: pop var(--d-base) var(--ease-out); transform-origin: 8px 0; }
  .bulkbar:not([hidden]) { animation: pop var(--d-base) var(--ease-out); }

  /* 6) 화면 이동 중 표시 — 응답이 느린 화면(주문·정산 조회 등)에서 눌렸는지 알 수 있게 위쪽에 가는 진행선 */
  #navProgress {
    position: fixed; top: 0; left: 0; width: 100%; height: 2px; z-index: 1000; pointer-events: none;
    background: linear-gradient(90deg, var(--accent), var(--violet));
    box-shadow: 0 0 10px rgba(124,92,252,0.55);
    transform-origin: 0 50%; transform: scaleX(0); opacity: 0;
    transition: opacity var(--d-base) ease;
  }
  #navProgress.run { opacity: 1; animation: nav-crawl 12s cubic-bezier(.08,.8,.2,1) forwards; }
  @keyframes nav-crawl { 0% { transform: scaleX(0); } 6% { transform: scaleX(0.35); } 100% { transform: scaleX(0.94); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; scroll-behavior: auto !important;
    }
  }
</style>
<script>
  // 화면별 스크립트(본문 안)가 공통 스크립트보다 먼저 돈다 — 그래서 모션 끄기 설정은 여기서 먼저 읽어둔다.
  var REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
</script>
</head>
<body>
<div id="navProgress" aria-hidden="true"></div>
<div class="layout">
  <nav class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">F</span><span>Friday</span></div>
    <div class="nav-links">
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint in ('index','index_demo') }}">홈</a>
      <a href="{{ url_for('health_view') }}" class="{{ 'active' if request.endpoint in ('health_view','health_demo') }}">헬스체크</a>
    </div>
    <p class="nav-group">상품</p>
    <div class="nav-links">
      <a href="{{ url_for('candidates') }}" class="{{ 'active' if request.endpoint in ('candidates','candidates_preview') }}">발굴 후보</a>
      <a href="{{ url_for('products_view') }}" class="{{ 'active' if request.endpoint in ('products_view','products_refresh_stock','products_bulk','registered_status') }}">상품 관리</a>
    </div>
    <p class="nav-group">주문</p>
    <div class="nav-links">
      <a href="{{ url_for('orders') }}" class="{{ 'active' if request.endpoint in ('orders','orders_demo','purchase_bulk_place','purchase_place','purchase_sync_tracking','orders_dispatch') }}">주문·발주</a>
      <a href="{{ url_for('cs') }}" class="{{ 'active' if request.endpoint in ('cs','cs_demo') }}">CS (반품·문의)</a>
    </div>
    <p class="nav-group">정산</p>
    <div class="nav-links">
      <a href="{{ url_for('settlement_view') }}" class="{{ 'active' if request.endpoint in ('settlement_view','settlement_demo','settlement_sync_cases') }}">정산</a>
    </div>
    <p class="nav-group">부가기능</p>
    <div class="nav-links">
      <a href="{{ url_for('margin') }}" class="{{ 'active' if request.endpoint == 'margin' }}">마진계산</a>
    </div>
  </nav>
  <div class="shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="flash flash-{{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</div>

<dialog id="modal">
  <div class="modal-head"><button type="button" class="modal-close" onclick="document.getElementById('modal').close()" aria-label="닫기">&times;</button></div>
  <div class="modal-body" id="modalBody"><div class="modal-loading">불러오는 중…</div></div>
</dialog>

<script>
  // 화면 이동 진행선 — 같은 사이트로 가는 링크·폼 제출에만. 모달 여는 링크처럼 다른 스크립트가
  // 기본 동작을 막은 경우(return false 등)는 실제로 이동하지 않으므로 띄우지 않는다.
  (function () {
    var bar = document.getElementById('navProgress');
    function start() { bar.classList.remove('run'); void bar.offsetWidth; bar.classList.add('run'); }
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a[href]');
      if (!a || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if ((a.target && a.target !== '_self') || a.hasAttribute('download')) return;
      var u = new URL(a.href, location.href);
      if (u.origin !== location.origin) return;
      if (u.pathname === location.pathname && u.search === location.search && a.getAttribute('href').charAt(0) === '#') return;
      setTimeout(function () { if (!e.defaultPrevented) start(); }, 0);
    });
    document.addEventListener('submit', function (e) {
      var f = e.target;
      if (f.target && f.target !== '_self') return;
      setTimeout(function () { if (!e.defaultPrevented) start(); }, 0);
    });
    // 뒤로가기로 돌아온 화면(bfcache)엔 진행선이 남아 있으면 안 된다
    window.addEventListener('pageshow', function () { bar.classList.remove('run'); });
  })();

  // 숫자 카운트업 — 금액·건수가 0에서 제 값까지 감속하며 올라간다. 자식 요소가 있거나
  // 소수·날짜처럼 숫자가 여러 덩어리인 값은 건드리지 않는다(글자가 깨지면 안 되니까).
  function countUp(el) {
    if (el.children.length) return;
    var m = el.textContent.match(/^(\s*\D*?)(-?\d[\d,]*)([^\d]*)$/);
    if (!m) return;
    var target = parseInt(m[2].replace(/,/g, ''), 10);
    if (!isFinite(target) || Math.abs(target) < 2) return;
    var useComma = m[2].indexOf(',') !== -1 || Math.abs(target) >= 1000;
    var t0 = null, dur = 900;
    function fmt(v) { return useComma ? v.toLocaleString() : String(v); }
    function step(ts) {
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur), k = 1 - Math.pow(1 - p, 4);
      el.textContent = m[1] + fmt(Math.round(target * k)) + m[3];
      if (p < 1) requestAnimationFrame(step);
    }
    el.style.fontVariantNumeric = 'tabular-nums';
    requestAnimationFrame(step);
    // 탭이 백그라운드면 프레임이 멈춘다 — 연출이 어디서 끊기든 최종값은 반드시 원래 숫자로 확정한다.
    var original = el.textContent;
    setTimeout(function () { el.textContent = original; }, dur + 150);
  }
  if (!REDUCE_MOTION) {
    document.querySelectorAll('.stat-num, .kpi-col .todo-line b, .sc-summary b, [data-countup]').forEach(countUp);
  }

  // 헤더 등의 "?" 버튼 — 클릭하면 설명이 뜨고, 바깥을 누르거나 다른 버튼을 누르면 닫힌다.
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-tip-toggle]');
    document.querySelectorAll('.tip-btn.open').forEach(function (b) {
      if (b !== btn) b.classList.remove('open');
    });
    if (btn) { btn.classList.toggle('open'); e.stopPropagation(); }
  });

  // 목록에서 상품을 눌렀을 때 페이지 이동 없이 미리보기를 모달로 띄운다.
  function openPreviewModal(url) {
    var dialog = document.getElementById('modal');
    var body = document.getElementById('modalBody');
    body.innerHTML = '<div class="modal-loading">불러오는 중…</div>';
    dialog.showModal();
    fetch(url)
      .then(function (r) { return r.text(); })
      .then(function (html) {
        body.innerHTML = html;
        if (!REDUCE_MOTION) {
          body.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }],
            { duration: 320, easing: 'cubic-bezier(.16,1,.3,1)' });
        }
        // innerHTML로 넣은 <script> 태그는 브라우저가 실행하지 않는다 — 모달 안에서
        // 쓰는 버튼(등록 항목 점검 토글, 추천 키워드 채우기 등)이 눌러도 반응 없던
        // 원인이 이거였다(2026-09 발견). 스크립트를 새로 만들어 다시 넣어야 실행된다.
        // 순서대로 하나씩 교체·실행한다 — <script src>(예: CDN 라이브러리)는 로드가
        // 끝날 때까지 기다렸다가 다음 스크립트로 넘어간다. async=false만으로는 안 된다
        // — 그건 src 있는 스크립트끼리의 순서만 보장하고, 뒤따르는 "순수 인라인" 스크립트는
        // 그 즉시 실행돼버려 CDN 로드가 끝나기 전에 "정의되지 않음" 오류가 났다(2026-09).
        var scripts = Array.prototype.slice.call(body.querySelectorAll('script'));
        (function runNext(i) {
          if (i >= scripts.length) return;
          var old = scripts[i];
          var fresh = document.createElement('script');
          if (old.src) {
            fresh.onload = function () { runNext(i + 1); };
            fresh.onerror = function () { console.error('스크립트 로드 실패:', old.src); runNext(i + 1); };
            fresh.src = old.src;
            old.replaceWith(fresh);
          } else {
            fresh.textContent = old.textContent;
            old.replaceWith(fresh);
            runNext(i + 1);
          }
        })(0);
      })
      .catch(function () { body.innerHTML = '<div class="flash flash-error">불러오지 못했습니다. 새로고침 후 다시 시도해주세요.</div>'; });
  }
</script>
</body>
</html>
